<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Seven Sisters Travel</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    }

    .auth-card {
      background: #fff;
      border-radius: var(--radius);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-logo .logo-icon {
      width: 60px;
      height: 60px;
      background: var(--primary);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 0.75rem;
    }

    .auth-logo h2 {
      margin-bottom: 0.25rem;
    }

    .auth-logo p {
      font-size: 0.88rem;
      color: var(--text-muted);
    }
  </style>
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-icon">🏔</div>
        <h2>Welcome back</h2>
        <p>Sign in to Seven Sisters Travel</p>
      </div>

      <button class="oauth-btn" onclick="oauthLogin('google')">
        <img class="oauth-icon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
        Continue with Google
      </button>
      <button class="oauth-btn" onclick="oauthLogin('github')">
        <svg class="oauth-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
        </svg>
        Continue with GitHub
      </button>

      <div class="oauth-divider"><span>or sign in with email</span></div>

      <div id="msg"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" name="email" placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" name="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg" id="loginBtn">Sign In</button>
      </form>

      <p style="text-align:center;margin-top:1.5rem;font-size:.88rem;color:var(--text-muted)">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfLoggedIn("/dashboard.html");

    function oauthLogin(provider) {
      window.location.href = `/api/auth/oauth/${provider}?redirect=${encodeURIComponent(window.location.origin + '/oauth-callback.html')}`;
    }
    window.oauthLogin = oauthLogin;

    document.getElementById("loginForm").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const fd = new FormData(e.target);
      btn.textContent = "Signing in..."; btn.disabled = true;
      try {
        const { token, user } = await authApi.login(fd.get("email"), fd.get("password"));
        saveSession(token, user);
        window.location.href = user.role === "admin" ? "/admin/index.html" : "/dashboard.html";
      } catch (err) {
        document.getElementById("msg").innerHTML = `<div class="alert alert-danger">❌ ${err.message}</div>`;
        btn.textContent = "Sign In"; btn.disabled = false;
      }
    });
  </script>
</body>

</html>
