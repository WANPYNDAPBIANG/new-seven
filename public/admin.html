<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <style>
        body{
            font-family: Arial;
            background:#f5f5f5;
            margin:0;
        }

        header{
            background:#2f6f4f;
            color:white;
            padding:20px;
        }

        .container{
            padding:20px;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .box{
            background:white;
            padding:15px;
            border-radius:10px;
            box-shadow:0 2px 6px rgba(0,0,0,.1);
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th,td{
            padding:10px;
            border-bottom:1px solid #ddd;
            text-align:left;
        }

        h2{
            margin-top:0;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Dashboard - Seven Sisters Travel</h1>
</header>

<div class="container">

    <div class="grid">

        <!-- BOOKINGS -->
        <div class="box">
            <h2>Bookings</h2>
            <table id="bookingsTable"></table>
        </div>

        <!-- USERS -->
        <div class="box">
            <h2>Users</h2>
            <table id="usersTable"></table>
        </div>

    </div>

</div>

<script>
const headers = {
    role: "admin"
};

// LOAD BOOKINGS
fetch("http://localhost:5000/api/admin/bookings", { headers })
.then(res => res.json())
.then(data => {

    let html = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Package</th>
            <th>Date</th>
            <th>Persons</th>
        </tr>
    `;

    data.forEach(b => {
        html += `
        <tr>
            <td>${b.id}</td>
            <td>${b.name}</td>
            <td>${b.package_name}</td>
            <td>${b.travel_date}</td>
            <td>${b.persons}</td>
        </tr>`;
    });

    document.getElementById("bookingsTable").innerHTML = html;
});

// LOAD USERS
fetch("http://localhost:5000/api/admin/users", { headers })
.then(res => res.json())
.then(data => {

    let html = `
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
        </tr>
    `;

    data.forEach(u => {
        html += `
        <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.phone}</td>
            <td>${u.role}</td>
        </tr>`;
    });

    document.getElementById("usersTable").innerHTML = html;
});
</script>

</body>
</html>
