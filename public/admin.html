<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seven Sisters Travel Agency</title>

    <link rel="stylesheet" href="/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <nav>
        <logo><img src="/images/logo.jpg" alt="Seven Sisters Travel Logo"></logo>
        <h2>Seven Sisters Travel</h2>

        <ul>
            <li><i class="fa-solid fa-house"></i><a href="../public/index.html">Home</a></li>
            <li><i class="fa-solid fa-suitcase-rolling"></i><a href="../public/packages.html">Packages</a></li>
            <li><i class="fa-solid fa-map-location-dot"></i><a href="../public/states.html">States</a></li>
            <li><i class="fa-solid fa-circle-info"></i><a href="../public/about.html">About</a></li>
            <li><i class="fa-solid fa-phone"></i><a href="../public/contact.html">Contact</a></li>


        </ul>
    </nav>

    <header>
        Admin Dashboard - Seven Sisters Travel
    </header>

    <!-- STATS -->
    <div class="stats">
        <div class="card">
            <h3>Total Users</h3>
            <p id="totalUsers">0</p>
        </div>

        <div class="card">
            <h3>Total Bookings</h3>
            <p id="totalBookings">0</p>
        </div>
    </div>

    <!-- TABLES -->
    <div class="grid">

        <div class="box">
            <h2>Recent Bookings</h2>
            <table id="bookingsTable"></table>
        </div>

        <div class="box">
            <h2>Users</h2>
            <table id="usersTable"></table>
        </div>

    </div>

    <script>
        const token = localStorage.getItem("token");

        // ❗ secure header
        const headers = {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
        };

        // BOOKINGS
        fetch("http://localhost:5000/api/admin/bookings", { headers })
            .then(r => r.json())
            .then(data => {

                document.getElementById("totalBookings").innerText = data.length;

                let html = `
    <tr>
        <th>ID</th>
        <th>User</th>
        <th>Package</th>
        <th>Date</th>
    </tr>`;

                data.forEach(b => {
                    html += `
        <tr>
            <td>${b.id}</td>
            <td>${b.name}</td>
            <td>${b.package_name}</td>
            <td>${b.travel_date}</td>
        </tr>`;
                });

                document.getElementById("bookingsTable").innerHTML = html;
            });

        // USERS
        fetch("http://localhost:5000/api/admin/users", { headers })
            .then(r => r.json())
            .then(data => {

                document.getElementById("totalUsers").innerText = data.length;

                let html = `
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>`;

                data.forEach(u => {
                    html += `
        <tr>
            <td>${u.id}</td>
            <td>${u.name}</td>
            <td>${u.email}</td>
            <td>${u.role}</td>
        </tr>`;
                });

                document.getElementById("usersTable").innerHTML = html;
            });
    </script>

</body>

</html>
